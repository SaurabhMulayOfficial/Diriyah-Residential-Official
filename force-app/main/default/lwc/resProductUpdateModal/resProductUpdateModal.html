<template>
    <!-- Main Update Modal -->
    <template if:true={showModal}>
        <!-- Simplified for Quick Action - no nested modal styling -->
        <div class="slds-p-around_small">
            <!-- Modal Header -->
            <div class="slds-page-header slds-m-bottom_medium">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__body">
                                <h1 class="slds-page-header__title slds-truncate slds-text-color_brand" title={modalTitle}>
                                    {modalTitle}
                                </h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="slds-p-around_small" id="modal-content-id">
                <!-- Status Warning Message -->
                <template if:true={statusMessage}>
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-bottom_medium" role="status">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:warning" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>{statusMessage}</p>
                        </div>
                    </div>
                </template>

                <!-- Update Form -->
                <lightning-record-edit-form record-id={recordId}
                                            object-api-name="Product2"
                                            onsuccess={handleSuccess}
                                            onerror={handleError}>

                    <!-- Tabbed Layout -->
                    <lightning-tabset>
                        <!-- Tab 1: Details -->
                        <lightning-tab label="Details">
                            <div class="slds-p-around_small">
                                <div class="slds-grid slds-wrap slds-gutters_small">
                                    <!-- Product Information -->
                                    <div class="slds-col slds-size_1-of-1">
                                        <h3 class="slds-text-heading_small slds-m-bottom_small">Product Information</h3>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={nameField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={productCodeField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={typeField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={constructionPhaseField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={businessEntityField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={familyField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={usageTypeArabicField}></lightning-input-field>
                                    </div>

                                    <!-- Configuration Information -->
                                    <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_small">Configuration Information</h3>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name={cipTypeField}></lightning-input-field>
                                    </div>

                                    <!-- Description -->
                                    <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_small">Description Information</h3>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input-field field-name={descriptionField}></lightning-input-field>
                                    </div>
                                </div>
                            </div>
                        </lightning-tab>

                        <!-- Tab 2: Fixtures / Fittings -->
                        <lightning-tab label="Fixtures / Fittings">
                            <div class="slds-p-around_small">
                                <div class="slds-grid slds-wrap slds-gutters_small">
                                    <!-- Fixtures / Fittings Characteristics -->
                                    <div class="slds-col slds-size_1-of-1">
                                        <h3 class="slds-text-heading_small slds-m-bottom_small">Fixtures / Fittings Characteristics</h3>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={orientationField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={entryCourtyardField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={storeroomField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={garageField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={elevatedField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={poolField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={terraceField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={idFinishField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={roofTerraceField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={driversRoomField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={maidsRoomField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={panoramicViewField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={wadiViewField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={privateField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={golfViewField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={conditionField}></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <lightning-input-field field-name={furnishedField}></lightning-input-field>
                                    </div>
                                </div>
                            </div>
                        </lightning-tab>
                    </lightning-tabset>

                    <!-- Update Comments (Required) - Always visible at bottom -->
                    <div class="slds-p-around_small slds-m-top_medium">
                        <lightning-textarea
                            name="updateComments"
                            label="Update Comments"
                            value={updateComments}
                            onchange={handleUpdateCommentsChange}
                            required
                            min-length="10"
                            max-length="32768"
                            placeholder="Please explain the reason for this update (minimum 10 characters)">
                        </lightning-textarea>
                        <div class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">
                            * Required - Explain why this unit is being updated
                        </div>
                    </div>

                    <!-- Hidden submit button to trigger form submission -->
                    <button type="submit" class="slds-hide">Submit</button>
                </lightning-record-edit-form>
            </div>

            <!-- Footer Actions -->
            <div class="footer-actions slds-m-top_large slds-p-top_large slds-border_top">
                <div class="slds-float_right">
                    <button class="slds-button slds-button_neutral slds-m-right_x-small"
                            onclick={closeModal}
                            disabled={isProcessing}>
                        Cancel
                    </button>
                    <button class="slds-button slds-button_brand"
                            onclick={handleSave}
                            disabled={isProcessing}>
                        <template if:true={isProcessing}>
                            <lightning-spinner alternative-text="Saving..." size="small"></lightning-spinner>
                        </template>
                        <template if:false={isProcessing}>
                            Save Changes
                        </template>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Warning Confirmation Modal -->
    <template if:true={showWarningModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="max-width: 40rem;">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">{warningTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-text-align_center">
                        <lightning-icon icon-name="utility:warning"
                                        size="large"
                                        variant="warning"
                                        class="slds-m-bottom_small">
                        </lightning-icon>
                    </div>
                    <p class="slds-text-align_center slds-text-body_regular">
                        {warningMessage}
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral"
                            onclick={handleWarningCancel}>
                        Cancel
                    </button>
                    <button class="slds-button slds-button_brand"
                            onclick={handleWarningConfirm}>
                        Yes, Proceed
                    </button>
                </footer>
            </div>
        </section>
    </template>
</template>
