<template>
    <div class="slds-p-around_small">
        <template if:true={planName}>
            <h2 class="slds-text-heading_small slds-m-bottom_small">Installments for {planName}</h2>
        </template>
        <p class="slds-text-body_small slds-m-bottom_small slds-text-color_weak">
            Define each installment's share of the payment plan. Percentages must add up to 100%.
            <template if:true={isOnPlan}>POC % is fixed at 100% for On-Plan catalogs.</template>
            <template if:true={isOffPlan}>POC % (construction milestone) is required for Off-Plan catalogs.</template>
            <template if:true={isOffPlan}>
                Enter each installment's Due Date (required for Off-Plan catalogs); the time from the payment plan's Valid From
                date to the due date is saved as its Condition Months and Days.
            </template>
            <template if:false={isOffPlan}>
                Condition Months (required) and Condition Days set each installment's due date;
                <template if:true={isOnPlan}>for On-Plan catalogs it is counted from the date the plan is configured on a quote.</template>
                <template if:false={isOnPlan}>it is counted from the payment plan's Valid From date.</template>
            </template>
            Due dates cannot go backwards from the previous installment
            <template if:true={maxMonths}>or exceed {maxMonths} months, including Condition Days (Number of Years x 12)</template>.
            Two installments with the same Installment Type cannot share the same Condition Months/Days.
        </p>

        <table class="slds-table slds-table_bordered slds-table_cell-buffer" aria-label="Installments">
            <thead>
                <tr class="slds-line-height_reset">
                    <th scope="col" style="width:3rem">#</th>
                    <th scope="col">Installment Type</th>
                    <th scope="col">Percentage</th>
                    <th scope="col">POC %</th>
                    <template if:true={isOffPlan}>
                        <th scope="col">Due Date</th>
                    </template>
                    <template if:false={isOffPlan}>
                        <th scope="col">Condition Months</th>
                        <th scope="col">Condition Days</th>
                    </template>
                    <th scope="col" style="width:6.5rem">Reorder</th>
                    <th scope="col" style="width:3rem"></th>
                </tr>
            </thead>
            <tbody>
                <template for:each={rows} for:item="row">
                    <tr key={row.key}>
                        <td>
                            <span class="slds-text-body_regular">{row.sequence}</span>
                        </td>
                        <td>
                            <lightning-combobox
                                data-key={row.key}
                                data-field="conditionType"
                                value={row.conditionType}
                                options={conditionTypeOptions}
                                onchange={handleFieldChange}
                                variant="label-hidden"
                                label="Installment Type"
                                placeholder="Select"
                                required
                            ></lightning-combobox>
                        </td>
                        <td>
                            <lightning-input
                                type="number"
                                step="0.01"
                                min="0"
                                max="100"
                                data-key={row.key}
                                data-field="percentage"
                                value={row.percentage}
                                onchange={handleFieldChange}
                                variant="label-hidden"
                                label="Percentage"
                                placeholder="e.g. 20"
                            ></lightning-input>
                        </td>
                        <td>
                            <lightning-input
                                type="number"
                                step="0.01"
                                min="0"
                                max="100"
                                data-key={row.key}
                                data-field="pocPercentage"
                                value={row.pocPercentage}
                                onchange={handleFieldChange}
                                variant="label-hidden"
                                label="POC %"
                                placeholder={pocPlaceholder}
                                required={isOffPlan}
                                disabled={isOnPlan}
                            ></lightning-input>
                        </td>
                        <template if:true={isOffPlan}>
                            <td>
                                <lightning-input
                                    type="date"
                                    date-style="medium"
                                    min={minDueDate}
                                    max={latestDueDate}
                                    data-key={row.key}
                                    data-field="dueDate"
                                    value={row.dueDate}
                                    onchange={handleFieldChange}
                                    variant="label-hidden"
                                    label="Due Date"
                                    required
                                ></lightning-input>
                                <template if:true={row.conditionLabel}>
                                    <p class="slds-text-body_small slds-text-color_weak">{row.conditionLabel}</p>
                                </template>
                            </td>
                        </template>
                        <template if:false={isOffPlan}>
                            <td>
                                <lightning-input
                                    type="number"
                                    step="1"
                                    min="0"
                                    max={maxMonths}
                                    data-key={row.key}
                                    data-field="conditionMonths"
                                    value={row.conditionMonths}
                                    onchange={handleFieldChange}
                                    variant="label-hidden"
                                    label="Condition Months"
                                    placeholder="e.g. 6"
                                    required
                                ></lightning-input>
                            </td>
                            <td>
                                <lightning-input
                                    type="number"
                                    step="1"
                                    min="0"
                                    data-key={row.key}
                                    data-field="conditionDays"
                                    value={row.conditionDays}
                                    onchange={handleFieldChange}
                                    variant="label-hidden"
                                    label="Condition Days"
                                    placeholder="0"
                                ></lightning-input>
                            </td>
                        </template>
                        <td>
                            <lightning-button-icon
                                icon-name="utility:up"
                                alternative-text="Move up"
                                title="Move up"
                                data-key={row.key}
                                onclick={handleMoveUp}
                                size="small"
                            ></lightning-button-icon>
                            <lightning-button-icon
                                icon-name="utility:down"
                                alternative-text="Move down"
                                title="Move down"
                                data-key={row.key}
                                onclick={handleMoveDown}
                                size="small"
                            ></lightning-button-icon>
                        </td>
                        <td>
                            <lightning-button-icon
                                icon-name="utility:delete"
                                alternative-text="Remove installment"
                                title="Remove installment"
                                data-key={row.key}
                                onclick={handleRemoveRow}
                                disabled={cannotRemoveRows}
                                size="small"
                                variant="border-filled"
                            ></lightning-button-icon>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <div class="slds-grid slds-grid_align-spread slds-m-top_small slds-grid_vertical-align-center">
            <lightning-button
                label="Add Installment"
                icon-name="utility:add"
                onclick={handleAddRow}
                disabled={isRowLimitReached}
            ></lightning-button>
            <div class="slds-text-align_right">
                <p class={totalBadgeClass}>Total: {totalPercentageDisplay}%</p>
                <template if:true={monthsLimitDisplay}>
                    <p class="slds-text-body_small slds-text-color_weak">{monthsLimitDisplay}</p>
                </template>
            </div>
        </div>
    </div>
</template>
