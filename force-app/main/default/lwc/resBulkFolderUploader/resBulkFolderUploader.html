<template>
    <article class="slds-card custom-rounded-card">
        <div class="slds-card__header slds-grid slds-p-top_medium slds-p-horizontal_medium slds-p-bottom_x-small">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:folder" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="custom-card-title slds-truncate">Upload Product Documents / Files</span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="slds-form-element">
                <label class="custom-form-label slds-form-element__label">Upload Files:</label>
                <div class="custom-file-input-box">
                    <lightning-file-upload
                        label=""
                        name="productFileUploader"
                        multiple
                        accept={acceptedFormatsString}
                        onuploadfinished={handleUploadFinished}
                        disabled={isUploading}>
                    </lightning-file-upload>
                </div>
            </div>

            <template if:true={showSuccessMessage}>
                <p class="custom-success-msg slds-m-top_small">{successMessageText}</p>
            </template>
        </div>
    </article>
</template>
