<template>

    <!-- ── Warning Modal ─────────────────────────────────────────── -->
    <template if:true={showWarningModal}>
        <div class="warn-overlay">
            <div class="warn-card">
                <!-- X button outside top-right corner -->
                <button class="warn-close-btn" onclick={handleCancelWarning} title="Close">&#x2715;</button>

                <!-- White body: title + message -->
                <div class="warn-body">
                    <h2 class="warn-title">Lead Conversion</h2>
                    <hr class="warn-divider" />
                    <p class="warn-message">
                        Once you set the lead to Qualified, an automated lead conversion
                        will happen. Do you wish to proceed?
                    </p>
                    <template if:true={_proceedError}>
                        <p class="warn-error">{_proceedError}</p>
                    </template>
                </div>

                <!-- Beige footer with pill buttons -->
                <div class="warn-footer">
                    <button class="warn-btn warn-btn-cancel"
                        onclick={handleCancelWarning}
                        disabled={isReverting}>Cancel</button>
                    <button class="warn-btn warn-btn-proceed"
                        onclick={handleProceed}
                        disabled={isProceedLoading}>Proceed</button>
                </div>
            </div>
        </div>
    </template>

    <!-- ── Post-Conversion Popup ─────────────────────────────────── -->
    <template if:true={showPopup}>
        <div class="overlay">
            <div class="popup-box">
                <div class="popup-header">
                    <button class="close-x" onclick={handleGoToLeads}>&#x2715;</button>
                    <h1 class="header-title">Your lead has been converted</h1>
                    <div class="trophy-icon">
                        <lightning-icon
                            icon-name="standard:lead"
                            size="large">
                        </lightning-icon>
                    </div>
                </div>
                <template if:true={isLoading}>
                    <div class="spinner-wrapper">
                        <lightning-spinner
                            alternative-text="Loading"
                            size="medium">
                        </lightning-spinner>
                        <p class="loading-text">Fetching converted records...</p>
                    </div>
                </template>
                <template if:true={errorMessage}>
                    <div class="error-banner">
                        <lightning-icon
                            icon-name="utility:error"
                            size="x-small"
                            variant="error">
                        </lightning-icon>
                        <span>{errorMessage}</span>
                    </div>
                </template>
                <template if:false={isLoading}>
                    <div class="cards-row">

                        <!-- Account / Person Account Card -->
                        <div class={accountCardClass} onclick={handleAccountClick}>
                            <div class="card-section-title">{accountTileLabel}</div>
                            <div class="card-inner">
                                <div class="card-record-header">
                                    <lightning-icon
                                        icon-name="standard:account"
                                        size="small">
                                    </lightning-icon>
                                    <span class="card-record-name">{accountName}</span>
                                </div>

                                <!-- ✅ Person Account fields -->
                                <template if:true={isPersonAccount}>
                                    <div class="card-fields">
                                        <div class="card-field-row">
                                            <span class="field-label">Account Source:</span>
                                            <span class="field-value">{opportunityLeadSource}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Mobile:</span>
                                            <span class="field-value">{accountMobile}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Email:</span>
                                            <span class="field-value owner-link">{accountEmail}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Rating:</span>
                                            <span class="field-value">{accountRating}</span>
                                        </div>
                                    </div>
                                </template>

                                <!-- ✅ Regular Account fields -->
                                <template if:false={isPersonAccount}>
                                    <div class="card-fields">
                                        <div class="card-field-row">
                                            <span class="field-label">Account Source:</span>
                                            <span class="field-value">{opportunityLeadSource}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Phone:</span>
                                            <span class="field-value">{accountPhone}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Website:</span>
                                            <span class="field-value">{accountWebsite}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Rating:</span>
                                            <span class="field-value">{accountRating}</span>
                                        </div>
                                    </div>
                                </template>

                            </div>
                        </div>

                        <!-- Contact Card — hidden for Person Account -->
                        <template if:false={isPersonAccount}>
                            <div class={contactCardClass} onclick={handleContactClick}>
                                <div class="card-section-title">CONTACT</div>
                                <div class="card-inner">
                                    <div class="card-record-header">
                                        <lightning-icon
                                            icon-name="standard:contact"
                                            size="small">
                                        </lightning-icon>
                                        <span class="card-record-name">{contactName}</span>
                                    </div>
                                    <!-- ✅ Contact fields per spec -->
                                    <div class="card-fields">
                                        <div class="card-field-row">
                                            <span class="field-label">Account Name:</span>
                                            <span class="field-value owner-link">{accountName}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Mobile:</span>
                                            <span class="field-value">{contactMobile}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Email:</span>
                                            <span class="field-value owner-link">{contactEmail}</span>
                                        </div>
                                        <div class="card-field-row">
                                            <span class="field-label">Lead Source:</span>
                                            <span class="field-value">{opportunityLeadSource}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Opportunity Card -->
                        <div class={opportunityCardClass} onclick={handleOpportunityClick}>
                            <div class="card-section-title">OPPORTUNITY</div>
                            <div class="card-inner">
                                <div class="card-record-header">
                                    <lightning-icon
                                        icon-name="standard:opportunity"
                                        size="small">
                                    </lightning-icon>
                                    <span class="card-record-name">{opportunityName}</span>
                                </div>
                                <!-- ✅ Opportunity fields per spec -->
                                <div class="card-fields">
                                    <div class="card-field-row">
                                        <span class="field-label">Account Name:</span>
                                        <span class="field-value owner-link">{accountName}</span>
                                    </div>
                                    <div class="card-field-row">
                                        <span class="field-label">Project:</span>
                                        <span class="field-value">{opportunityProject}</span>
                                    </div>
                                    <div class="card-field-row">
                                        <span class="field-label">Close Date:</span>
                                        <span class="field-value">{opportunityCloseDate}</span>
                                    </div>
                                    <div class="card-field-row">
                                        <span class="field-label">Lead Source:</span>
                                        <span class="field-value">{opportunityLeadSource}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </template>
                <div class="popup-footer">
                    <button class="btn-go-to-leads" onclick={handleGoToLeads}>Go to Leads</button>
                </div>
            </div>
        </div>
    </template>
</template>
